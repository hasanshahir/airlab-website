<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#projBg)" />
  <rect width="600" height="400" fill="url(#grid)" />
  
  <!-- Neural graph nodes -->
  <g stroke="#475569" stroke-width="1.5" stroke-opacity="0.6">
    <line x1="200" y1="160" x2="300" y2="120" />
    <line x1="300" y1="120" x2="400" y2="160" />
    <line x1="200" y1="160" x2="250" y2="240" />
    <line x1="400" y1="160" x2="350" y2="240" />
    <line x1="250" y1="240" x2="350" y2="240" />
    <line x1="300" y1="120" x2="300" y2="210" />
    <line x1="300" y1="210" x2="250" y2="240" />
    <line x1="300" y1="210" x2="350" y2="240" />
  </g>
  
  <circle cx="200" cy="160" r="6" fill="#3b82f6" />
  <circle cx="400" cy="160" r="6" fill="#3b82f6" />
  <circle cx="250" cy="240" r="6" fill="#64748b" />
  <circle cx="350" cy="240" r="6" fill="#64748b" />
  <circle cx="300" cy="210" r="8" fill="#f97316" />
  <circle cx="300" cy="120" r="10" fill="url(#glow)" />

  <text x="300" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="3">AIR LAB RESEARCH PROJECT</text>
  <text x="300" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b" letter-spacing="1.5">DATA & SPECIFICATION PREVIEW</text>
</svg>
